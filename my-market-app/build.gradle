import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.12'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.openapi.generator" version "7.19.0"
}

group = 'ru.ism'
version = '0.0.1-SNAPSHOT'
description = 'my-market-app'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	mapstructVersion = "1.6.3"
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.2'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	runtimeOnly 'org.postgresql:r2dbc-postgresql'
	compileOnly("org.projectlombok:lombok:1.18.42")
	annotationProcessor("org.projectlombok:lombok:1.18.42")
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	testCompileOnly("org.projectlombok:lombok:1.18.42")
	testAnnotationProcessor("org.projectlombok:lombok:1.18.42")
	testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
  	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation platform('org.testcontainers:testcontainers-bom:2.0.2')
	testImplementation('org.springframework.boot:spring-boot-testcontainers')
	testImplementation('org.testcontainers:testcontainers-postgresql')
	testImplementation('org.testcontainers:testcontainers-junit-jupiter')
	testImplementation('org.testcontainers:r2dbc:1.21.4')
	testImplementation 'com.redis:testcontainers-redis:2.2.4'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('buildClient', GenerateTask) {
	generatorName.set("java")
	inputSpec.set("$projectDir/src/main/resources/payService.yaml")
	outputDir.set("$projectDir/build/generated")
	modelPackage.set("ru.ism.mymarketapp.client.domain")
	invokerPackage.set("ru.ism.mymarketapp.client")
	apiPackage.set("ru.ism.mymarketapp.client.api")
	configOptions.set([
			hideGenerationTimestamp: "true",
			library                : "webclient",
			useJakartaEe           : "true",
			useTags                : "true",
			openApiNullable        : "false",
			serializableModel      : "true"
	])
}

sourceSets.main.java.srcDir "$projectDir/build/generated/src/main/java"

tasks.named('compileJava') {
	dependsOn(tasks.buildClient)
}
springBoot {
	mainClass = 'ru.ism.mymarketapp.MyMarketAppApplication'
}