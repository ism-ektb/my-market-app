spring.application.name=my-market-app

spring.r2dbc.url=${DATASOURCE.URL:r2dbc:postgresql://localhost:6432/market}
spring.r2dbc.username=user
spring.r2dbc.password=user
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=30s
spring.r2dbc.pool.max-life-time=10m
spring.r2dbc.pool.validation-query=SELECT 1

spring.sql.init.mode=always

spring.data.redis.host=${CACHE.HOST:localhost}

client.url=${PAY_SERVICE.HOST:http://localhost:8081}

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK.URL:http://localhost:8080/realms/my_server}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=market-app
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK.SECRET:pyAR9tgEN1pXxcwgmurMRfYEe0GBVEQL}
spring.security.oauth2.client.registration.keycloak.scope=openid

server.port=8085

