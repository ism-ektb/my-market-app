services:
  market-postgres:
    image: postgres:13.3
    container_name: market-upp
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=user
      - POSTGRES_DB=market
    ports:
      - '6432:5432'

  market_service:
    build: .
    container_name: shop-upp
    ports:
      - "8080:8080"
    depends_on:
      - market-postgres
    environment:
      - DATASOURCE.URL=r2dbc:postgresql://market-postgres:5432/market